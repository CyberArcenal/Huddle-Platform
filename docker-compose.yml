version: "3.9"

services:
  web:
    container_name: barangay_system_web
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    working_dir: /app
    volumes:
      - .:/app:delegated
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"  # WebSocket/API port
      - "7881:7881"  # TCP ICE port
      - "7882:7882/udp" # UDP port for WebRTC
      - "50000-60000:50000-60000/udp" # UDP ports for media
    command: --config /etc/livekit/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  db:
    container_name: barangay_system_db
    image: postgres:15
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: